# Builds DEAD AIR and publishes it to GitHub Pages. The films are not in git: they
# are fetched from archive.org and cut here, as on any checkout (docs/hosting.md).
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - uses: actions/cache@v4
        with:
          path: .media-cache
          key: media-${{ hashFiles('scripts/fetch-media.mjs') }}
      - run: npm ci
      - run: npm run fetch:media
      - run: npm run -s validate:catalog
      - run: npx vitest run
      - name: Build
        run: npm run build
        env:
          DEADAIR_BASE: /Dead-Air/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
